# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Routey"

[setup]
script = '''
#!/bin/zsh
set -euo pipefail

cd "$CODEX_WORKTREE_PATH"

# Routey feature work should start from nightly, not origin/HEAD/main.
git fetch origin nightly --prune

if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/nightly)" ]]; then
  if [[ -n "$(git status --porcelain)" ]]; then
    echo "Refusing to move a dirty worktree to origin/nightly." >&2
    exit 1
  fi

  git reset --hard origin/nightly
fi

swift package --package-path RouteyKit resolve
xcodebuild -resolvePackageDependencies -project app/Routey/Routey.xcodeproj -scheme Routey
'''

