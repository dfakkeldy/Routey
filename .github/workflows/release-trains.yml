name: Release Trains

on:
  schedule:
    # Times are UTC. GitHub cron is best-effort and can lag HOURS at peak, so
    # the resolver keys on WHICH cron entry fired (github.event.schedule),
    # never on the wall-clock time at execution — a delayed run still ships
    # its train. Both UTC candidates for Halifax DST are listed; the resolver
    # skips whichever candidate is inactive for the current UTC offset.
    #
    # The old "0 5/6 * * *" nightly gated on the run EXECUTING during the
    # 02:xx Halifax hour; every run from 2026-06-28 through 2026-07-10 fired
    # 2.5–4 h late at the :00 cron herd, so the nightly ship job never ran
    # once. The :40 minute avoids the herd, and 08:40 UTC (05:40 Halifax ADT)
    # is the same low-demand overnight-Americas window Echo's trains use.
    - cron: "40 8 * * *"  # Nightly — 05:40 America/Halifax (ADT, UTC-3)
    - cron: "40 9 * * *"  # Nightly — 05:40 America/Halifax (AST, UTC-4)
    - cron: "40 8 * * 1"  # Weekly  — Mondays 05:40 America/Halifax (ADT)
    - cron: "40 9 * * 1"  # Weekly  — Mondays 05:40 America/Halifax (AST)
  workflow_dispatch:
    inputs:
      channel:
        description: Release train to build
        required: true
        type: choice
        options:
          - nightly
          - weekly

jobs:
  resolve:
    name: Resolve release train
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      channel: ${{ steps.resolve.outputs.channel }}
      run-build: ${{ steps.resolve.outputs.run-build }}
    steps:
      - name: Resolve channel and branch
        id: resolve
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_CHANNEL: ${{ inputs.channel || '' }}
        run: |
          set -euo pipefail

          channel=""
          run_build="true"
          reason=""

          # Map the cron entry that fired to its channel. Scheduled runs carry
          # their own cron string, so this stays correct no matter how late
          # GitHub actually starts the run.
          case "${SCHEDULE}" in
            "40 8 * * *"|"40 9 * * *") channel="nightly"; reason="nightly cron '${SCHEDULE}'" ;;
            "40 8 * * 1"|"40 9 * * 1") channel="weekly"; reason="weekly cron '${SCHEDULE}'" ;;
            "") channel="${DISPATCH_CHANNEL}"; reason="manual dispatch" ;;
            *) run_build="false"; reason="unrecognized cron '${SCHEDULE}'" ;;
          esac

          # The only wall-clock use: skip the DST candidate that is inactive
          # for the current Halifax offset (both candidates always fire).
          if [[ -n "${SCHEDULE}" ]]; then
            offset="$(TZ=America/Halifax date +%z)"
            scheduled_hour="$(awk '{ print $2 }' <<<"${SCHEDULE}")"

            case "${offset}" in
              -0300) active_hour="8" ;;
              -0400) active_hour="9" ;;
              *)
                echo "::error::Unexpected America/Halifax UTC offset: ${offset}"
                exit 1
                ;;
            esac

            if [[ "${scheduled_hour}" != "${active_hour}" ]]; then
              run_build="false"
              reason="inactive DST duplicate cron '${SCHEDULE}' for offset ${offset}"
            fi
          fi

          if [[ "${run_build}" == "true" && "${channel}" != "nightly" && "${channel}" != "weekly" ]]; then
            echo "::error::Unsupported release channel: ${channel}"
            exit 1
          fi

          {
            echo "channel=${channel}"
            echo "branch=${channel}"
            echo "run-build=${run_build}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Release train resolver: ${reason}"

  ship:
    name: Build and upload
    runs-on: macos-26
    needs: resolve
    if: needs.resolve.outputs.run-build == 'true'
    timeout-minutes: 75
    # One shared group across ALL channels, deliberately not per-channel: the
    # build number is latest_testflight_build_number + 1 (fastlane), so two
    # overlapping runs read the same number and collide on upload ("Redundant
    # Binary Upload"). That is guaranteed on Mondays, when the nightly and
    # weekly crons fire at the same minute — serialise so the second run reads
    # its number only after the first finishes uploading.
    concurrency:
      group: release-trains
      cancel-in-progress: false

    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            RouteyKit/.build
          key: ${{ runner.os }}-xcode26.5-release-${{ needs.resolve.outputs.channel }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode26.5-release-${{ needs.resolve.outputs.channel }}-
            ${{ runner.os }}-xcode26.5-release-

      - name: Resolve packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project app/Routey/Routey.xcodeproj \
            -scheme Routey
          swift package --package-path RouteyKit resolve

      - name: Resolve simulator destination
        run: |
          set -euo pipefail

          ruby <<'RUBY' > "$RUNNER_TEMP/simulator.env"
          require "json"
          require "rubygems"

          devices = JSON.parse(`xcrun simctl list devices available -j`).fetch("devices")
          candidates = devices.flat_map do |runtime, runtime_devices|
            next [] unless runtime.include?("iOS")

            version_text = runtime[/iOS-(.+)$/, 1].to_s.tr("-", ".")
            version = Gem::Version.new(version_text.empty? ? "0" : version_text)
            runtime_devices
              .select { |device| device["isAvailable"] && device["name"].start_with?("iPhone") }
              .map { |device| [version, device] }
          end

          selected = candidates.sort_by(&:first).last
          if selected
            _version, device = selected
            puts "IOS_SIM_DESTINATION=platform=iOS Simulator,id=#{device.fetch("udid")}"
          else
            puts "IOS_SIM_DESTINATION=generic/platform=iOS Simulator"
          end
          RUBY

          cat "$RUNNER_TEMP/simulator.env" >> "$GITHUB_ENV"

      - name: Compile iOS app for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project app/Routey/Routey.xcodeproj \
            -scheme Routey \
            -configuration Debug \
            -destination "${IOS_SIM_DESTINATION}" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile macOS proof app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project app/Routey/Routey.xcodeproj \
            -scheme RouteyMacProof \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Check release secrets
        id: release-secrets
        env:
          APP_STORE_CONNECT_API_KEY_JSON_VALUE: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          MATCH_PASSWORD_VALUE: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_SSH_KEY_VALUE: ${{ secrets.MATCH_GIT_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -n "${APP_STORE_CONNECT_API_KEY_JSON_VALUE}" && -n "${MATCH_PASSWORD_VALUE}" && -n "${MATCH_GIT_SSH_KEY_VALUE}" ]]; then
            echo "can-upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TestFlight upload because APP_STORE_CONNECT_API_KEY_JSON, MATCH_PASSWORD, and MATCH_GIT_SSH_KEY are not all set; release train remains compile-only."
          fi

      - name: Load match deploy key
        if: steps.release-secrets.outputs.can-upload == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_SSH_KEY }}

      - name: Set up Ruby
        if: steps.release-secrets.outputs.can-upload == 'true'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Upload to TestFlight
        if: steps.release-secrets.outputs.can-upload == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TESTFLIGHT_FEEDBACK_EMAIL: ${{ secrets.TESTFLIGHT_FEEDBACK_EMAIL }}
          TESTFLIGHT_MARKETING_URL: ${{ vars.TESTFLIGHT_MARKETING_URL || '' }}
          TESTFLIGHT_PRIVACY_POLICY_URL: ${{ vars.TESTFLIGHT_PRIVACY_POLICY_URL || '' }}
        run: |
          set -euo pipefail

          api_key_path="${RUNNER_TEMP}/app-store-connect-api-key.json"
          printf '%s' "${APP_STORE_CONNECT_API_KEY_JSON}" > "${api_key_path}"
          export APP_STORE_CONNECT_API_KEY_JSON_PATH="${api_key_path}"

          bundle exec fastlane beta channel:"${CHANNEL}"
